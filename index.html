<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Login Form</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 60px;
            text-align: center;
            color: #0d6efd;
        }

        .btn-login {
            width: 100%;
        }

        .password-box {
            position: relative;
        }

        #togglePassword {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">👤</div>

        <h2 class="text-center mb-4">
            Login
        </h2>

        <form id="loginForm">

            <!-- Username -->
            <div class="mb-3">

                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Enter Username"
                    required>

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter Password"
                        required>

                    <span id="togglePassword">👁</span>

                </div>

            </div>

            <!-- Remember Me -->
            <div class="mb-3 form-check">

                <input
                    type="checkbox"
                    class="form-check-input"
                    id="remember">

                <label
                    class="form-check-label"
                    for="remember">
                    Remember Me
                </label>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-primary btn-login">
                Login
            </button>

            <!-- Forgot Password -->
            <div class="text-center mt-3">
                <a href="#">Forgot Password?</a>
            </div>

            <!-- Register -->
            <div class="text-center mt-2">
                Don't have an account?
                <a href="#">Register</a>
            </div>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
